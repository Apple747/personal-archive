<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>添加记录 — Personal Archive</title>
  <link rel="stylesheet" href="assets/refined.css">
  <link rel="stylesheet" href="assets/enhanced.css">
  <link rel="stylesheet" href="assets/manage-cartoon.css">
  <style>
    body{min-height:100vh;background:var(--paper);color:var(--ink)}.studio{min-height:100vh;display:grid;grid-template-columns:.78fr 1.22fr}.studio-side{padding:12vh 6vw;background:var(--ink);color:var(--paper);position:relative;overflow:hidden}.studio-side:after{content:'';position:absolute;width:34vw;height:34vw;border:1px solid #ffffff1d;border-radius:50%;left:-12vw;bottom:-15vw}.studio-side small{font-size:9px;letter-spacing:.2em;color:var(--teal)}.studio-side h1{font-family:"Noto Serif SC",Georgia,serif;font-weight:500;font-size:clamp(42px,6vw,76px);line-height:1.15;margin:25px 0}.studio-side p{line-height:1.9;color:#ffffff9c}.studio-side img{position:absolute;width:min(25vw,330px);right:-4vw;bottom:0;filter:drop-shadow(15px 20px #0003);animation:studioFloat 6s ease-in-out infinite}@keyframes studioFloat{50%{transform:translateY(-8px)}}
    .editor{padding:10vh 7vw}.editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:45px}.editor-head h2{font-family:Georgia,serif;font-weight:400;font-size:28px}.editor-head a{font-size:10px;border-bottom:1px solid;padding:8px 0}.form{display:grid;grid-template-columns:1fr 1fr;gap:24px}.field{display:flex;flex-direction:column;gap:9px}.field.full{grid-column:1/-1}.field label{font-size:8px;letter-spacing:.15em;color:var(--teal-deep)}input,select,textarea{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:13px 2px;font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--teal-deep)}textarea{min-height:170px;resize:vertical;line-height:1.8}.upload{border:1px dashed var(--line);min-height:150px;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;cursor:pointer}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}.upload img{width:100%;height:230px;object-fit:cover;display:none}.upload.has-image img{display:block}.upload.has-image span{display:none}.upload span{font-size:11px;line-height:1.8;color:#667}.actions{grid-column:1/-1;display:flex;gap:12px;margin-top:18px}.actions button{border:1px solid var(--ink);background:none;color:inherit;padding:13px 22px;cursor:pointer;font-size:10px;letter-spacing:.1em}.actions .save{background:var(--ink);color:var(--paper)}.saved{position:fixed;right:30px;bottom:30px;background:var(--ink);color:var(--paper);padding:14px 20px;font-size:10px;transform:translateY(100px);transition:.45s}.saved.show{transform:none}.backup{margin-top:55px;padding-top:25px;border-top:1px solid var(--line)}.backup p{font-size:11px;color:#68707a}.backup button{border:0;background:none;padding:8px 0;margin-right:20px;border-bottom:1px solid;cursor:pointer;color:inherit;font-size:9px}.entry-count{font-family:Georgia,serif;color:var(--teal-deep)}
    @media(max-width:800px){.studio{grid-template-columns:1fr}.studio-side{min-height:42vh;padding:9vh 25px 5vh}.studio-side img{width:45vw;right:-7vw}.editor{padding:7vh 25px}.form{grid-template-columns:1fr}.field.full,.actions{grid-column:1}.editor-head{align-items:flex-start}.editor-head h2{margin-top:0}}
  </style>
  <link rel="stylesheet" href="assets/manage-cartoon.css">
</head>
<body>
  <main class="studio">
    <aside class="studio-side"><small>PERSONAL ARCHIVE / LOCAL STUDIO</small><h1>添加一段<br>新的记录。</h1><p>照片、文字和当时的心情，都可以慢慢保存。<br>当前是本地版本，内容只保存在这台设备的浏览器中。</p><img src="assets/images/miku-chibi.png" alt="Q版 Miku"></aside>
    <section class="editor"><header class="editor-head"><div><small>NEW ENTRY</small><h2>内容编辑器</h2></div><a href="life.html">查看生活记录 →</a></header>
      <form class="form" id="entry-form">
        <div class="field"><label for="date">日期</label><input id="date" name="date" type="date" required></div>
        <div class="field"><label for="category">内容类型</label><select id="category" name="category"><option value="life">生活记录</option><option value="book">阅读书籍</option><option value="hobby">兴趣收藏</option><option value="note">随手文字</option></select></div>
        <div class="field full context-panel" id="book-fields" hidden><div><label for="book-status">放入哪个书架？</label><select id="book-status" name="bookStatus"><option value="current">正在读</option><option value="favorite">特别喜欢</option><option value="finished">今年读完</option></select></div><div><label for="author">作者</label><input id="author" name="author" placeholder="作者姓名（可选）"></div><div><label for="progress">阅读进度 %</label><input id="progress" name="progress" type="number" min="0" max="100" value="0"></div><div><label for="rating">评分</label><select id="rating" name="rating"><option value="">暂不评分</option><option>★★★★★</option><option>★★★★☆</option><option>★★★☆☆</option><option>★★☆☆☆</option><option>★☆☆☆☆</option></select></div></div>
        <div class="field full context-panel" id="hobby-fields" hidden><div><label for="hobby-type">放入哪个收藏夹？</label><select id="hobby-type" name="hobbyType"><option value="anime">动画记录</option><option value="game">游戏档案</option><option value="music">循环播放</option><option value="photo">现实碎片</option></select></div><div><label for="hobby-status">当前状态</label><select id="hobby-status" name="hobbyStatus"><option>最近喜欢</option><option>正在体验</option><option>已经完成</option><option>长期收藏</option></select></div></div>
        <div class="field full"><label for="title">标题</label><input id="title" name="title" placeholder="今天发生了什么？" required></div>
        <div class="field full"><label>照片（可选）</label><label class="upload" id="upload"><input id="photo" type="file" accept="image/*"><span>点击选择照片<br><small>图片会自动压缩后保存</small></span><img id="preview" alt="照片预览"></label></div>
        <div class="field full"><label for="text">正文</label><textarea id="text" name="text" placeholder="写下一点当时的感受……" required></textarea></div>
        <div class="actions"><button class="save" type="submit">保存这篇记录</button><button type="reset">清空</button></div>
      </form>
      <div class="backup"><p>当前已保存 <b class="entry-count">0</b> 篇本地记录。建议定期导出备份，避免清理浏览器数据后丢失。</p><button id="export" type="button">导出备份</button><button id="import-button" type="button">导入备份</button><input id="import-file" type="file" accept="application/json" hidden></div>
    </section>
  </main><div class="saved">已经保存到生活记录</div>
  <script>
    const key='pa-entries',form=document.querySelector('#entry-form'),photo=document.querySelector('#photo'),preview=document.querySelector('#preview'),upload=document.querySelector('#upload'),notice=document.querySelector('.saved'),count=document.querySelector('.entry-count'),category=document.querySelector('#category'),bookFields=document.querySelector('#book-fields'),hobbyFields=document.querySelector('#hobby-fields');let image='';
    const entries=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}};const updateCount=()=>count.textContent=entries().length;const syncFields=()=>{bookFields.hidden=category.value!=='book';hobbyFields.hidden=category.value!=='hobby';const book=category.value==='book';document.querySelector('label[for="title"]').textContent=book?'书名':'标题';document.querySelector('#title').placeholder=book?'输入书名':'今天发生了什么？'};category.addEventListener('change',syncFields);updateCount();document.querySelector('#date').value=new Date().toISOString().slice(0,10);const query=new URLSearchParams(location.search);if(['life','book','hobby','note'].includes(query.get('type')))category.value=query.get('type');if(query.get('status'))document.querySelector('#book-status').value=query.get('status');if(query.get('hobby'))document.querySelector('#hobby-type').value=query.get('hobby');syncFields();
    photo.addEventListener('change',()=>{const file=photo.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);image=canvas.toDataURL('image/jpeg',.82);preview.src=image;upload.classList.add('has-image')};img.src=e.target.result};reader.readAsDataURL(file)});
    form.addEventListener('reset',()=>{image='';upload.classList.remove('has-image');setTimeout(()=>document.querySelector('#date').value=new Date().toISOString().slice(0,10))});
    form.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(form),all=entries(),type=data.get('category'),labels={life:'生活记录',book:'阅读书籍',hobby:'兴趣收藏',note:'随手文字'};all.unshift({id:Date.now(),date:data.get('date'),type,category:labels[type],subtype:type==='book'?data.get('bookStatus'):(type==='hobby'?data.get('hobbyType'):''),title:data.get('title'),text:data.get('text'),image,author:data.get('author')||'',progress:Number(data.get('progress')||0),rating:data.get('rating')||'',status:data.get('hobbyStatus')||''});try{localStorage.setItem(key,JSON.stringify(all));updateCount();notice.textContent=type==='book'?'已经放入对应书架':(type==='hobby'?'已经放入兴趣收藏':'已经保存到生活记录');notice.classList.add('show');setTimeout(()=>notice.classList.remove('show'),2200);form.reset();category.value=type;syncFields()}catch{alert('照片占用空间过大，请换一张较小的图片，或者先导出并清理旧记录。')}});
    document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify(entries(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='personal-archive-backup.json';a.click();URL.revokeObjectURL(a.href)};
    document.querySelector('#import-button').onclick=()=>document.querySelector('#import-file').click();document.querySelector('#import-file').onchange=e=>{const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data))throw 0;localStorage.setItem(key,JSON.stringify(data));updateCount();alert('备份已导入。')}catch{alert('这个备份文件无法读取。')}};reader.readAsText(e.target.files[0])};
  </script>
</body></html>

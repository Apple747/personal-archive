<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关于这里 — Personal Archive</title><link rel="stylesheet" href="assets/refined.css"><script defer src="assets/refined.js"></script></head><body class="subpage"><div class="page-wipe"></div><header class="site-head"><a class="brand" href="index.html"><span>PA</span><b>Personal Archive</b></a></header><main><section class="sub-hero"><div><small>05 / ABOUT</small><h1>关于这里</h1><p>名字、身份和角色都还没有确定。这个版本先用 Miku 帮助我们找到真正喜欢的视觉方向。</p></div><img src="assets/images/miku-hero.png" alt=""></section><section class="sub-content"><article class="essay"><h2>为什么想做个人网站？</h2><p>社交平台适合分享当下，但不太适合保存完整的自己。这里希望成为一个可以持续很多年的空间：内容能够按年份沉淀，也允许兴趣随时改变。</p><h2>现在确定了什么？</h2><p>图文需要并重；网站应该有动感，但阅读时不能疲惫；二次元角色可以成为引导者，但不能遮住真正属于你的生活。</p><h2>什么还会改变？</h2><p>网站名称、个人形象、真实照片、文章内容和最终配色都会继续调整。</p><a class="back-home" href="index.html">← 返回首页</a></article></section></main></body></html>
